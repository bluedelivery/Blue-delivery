<script>
    // Menyimpan data transaksi sederhana di LocalStorage agar tersimpan otomatis
    let riwayatTransaksi = JSON.parse(localStorage.getItem('bd_riwayat')) || [];

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('nav-' + tabName).classList.add('active');
        window.scrollTo(0, 0);
        if (tabName === 'akun' || tabName === 'history') {
            muatDataAkun();
        }
    }

    function ambilLokasi(elementId) {
        let inputField = document.getElementById(elementId);
        inputField.value = "Mencari lokasi...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    inputField.value = "Lokasi (" + position.coords.latitude.toFixed(4) + ", " + position.coords.longitude.toFixed(4) + ")";
                },
                function(error) {
                    inputField.value = "Kec. Tikung, Lamongan";
                },
                { timeout: 7000, enableHighAccuracy: true }
            );
        } else {
            inputField.value = "Kec. Tikung, Lamongan";
        }
    }

    function tambahBarisProduk() {
        let container = document.getElementById('containerProduk');
        let div = document.createElement('div');
        div.className = 'product-item-box';
        div.innerHTML = `
            <button type="button" class="btn-remove" onclick="this.parentElement.remove(); hitungOtomatis();">Hapus</button>
            <input type="text" class="namaProduk" placeholder="Nama Produk Lain">
            <div class="row-2">
                <input type="number" class="hargaProduk" placeholder="Harga" value="0" oninput="hitungOtomatis()">
                <input type="number" class="jumlahProduk" placeholder="Jumlah" value="1" oninput="hitungOtomatis()">
            </div>
        `;
        container.appendChild(div);
        hitungOtomatis();
    }

    function hitungOtomatis() {
        let jenisOrder = document.getElementById('jenisOrder').value;
        let boxKM = document.getElementById('boxJarakKM');
        let tarifDasar = 0;

        if (jenisOrder === "ojek") {
            boxKM.style.display = "block";
            let km = parseFloat(document.getElementById('jarakKm').value) || 2;
            if (km <= 2) {
                tarifDasar = 7000;
            } else {
                tarifDasar = 7000 + (Math.ceil(km - 2) * 1000);
            }
        } else {
            boxKM.style.display = "none";
            tarifDasar = parseInt(jenisOrder) || 7000;
        }

        let listHarga = document.querySelectorAll('.hargaProduk');
        let listJumlah = document.querySelectorAll('.jumlahProduk');
        let totalHargaBarang = 0;

        for (let i = 0; i < listHarga.length; i++) {
            let h = parseFloat(listHarga[i].value) || 0;
            let j = parseFloat(listJumlah[i].value) || 1;
            totalHargaBarang += (h * j);
        }

        let tambahPembelian = parseFloat(document.getElementById('tambahPembelian').value) || 0;
        let casModal = parseFloat(document.getElementById('casModal').value) || 0;
        let totalOrderProduk = parseFloat(document.getElementById('totalOrderProduk').value) || 1;
        let tambahBersebelahan = parseFloat(document.getElementById('tambahBersebelahan').value) || 0;
        let pindahTempat = parseFloat(document.getElementById('pindahTempat').value) || 0;
        let cesRonjot = parseFloat(document.getElementById('cesRonjot').value) || 0;
        let biayaParkir = parseFloat(document.getElementById('biayaParkir').value) || 0;
        let cesHujan = document.getElementById('cesHujan').checked ? 3000 : 0;
        let dorongMotor = document.getElementById('dorongMotor').checked ? 10000 : 0;

        // Kalkulasi total akhir
        let totalBiaya = tarifDasar + totalHargaBarang + tambahPembelian + casModal + (totalOrderProduk * 1000) + tambahBersebelahan + pindahTempat + cesRonjot + biayaParkir + cesHujan + dorongMotor;

        document.getElementById('labelTotalOtomatis').innerText = "Rp. " + totalBiaya.toLocaleString('id-ID');
        return totalBiaya;
    }

    function kirimOrderan() {
        let total = hitungOtomatis();
        let waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        
        let dataBaru = {
            waktu: waktu,
            total: total,
            tujuan: document.getElementById('lokasiAntar').value || 'Tujuan Lokal'
        };

        riwayatTransaksi.unshift(dataBaru);
        localStorage.setItem('bd_riwayat', JSON.stringify(riwayatTransaksi));

        alert("Orderan berhasil dikirim! Total: Rp. " + total.toLocaleString('id-ID'));
        
        // Reset form sederhana
        document.getElementById('lokasiAntar').value = '';
        document.getElementById('lokasiPembelian').value = '';
        hitungOtomatis();
        muatDataAkun();
    }

    function muatDataAkun() {
        let containerRiwayat = document.getElementById('listRiwayat');
        if (riwayatTransaksi.length === 0) {
            containerRiwayat.innerHTML = "Belum ada riwayat transaksi.";
            document.getElementById('statOrderan').innerText = "0";
            document.getElementById('statPendapatan').innerText = "Rp. 0";
            document.getElementById('gridMingguIni').innerText = "Rp. 0 (0x)";
            document.getElementById('totalPotonganMingguIni').innerHTML = `Rp. 0 <span style="font-size: 14px; font-weight: normal; color: #555;">(0x)</span>`;
            document.getElementById('targetMingguIni').innerText = "0/35 Order";
        } else {
            let html = "";
            let totalPendapatanHariIni = 0;
            riwayatTransaksi.forEach((item, index) => {
                html += `<div style="padding: 8px 0; border-bottom: 1px solid #eee;">
                    <b>[${item.waktu}]</b> ${item.tujuan} - <span style="color: #27ae60; font-weight: bold;">Rp. ${item.total.toLocaleString('id-ID')}</span>
                </div>`;
                totalPendapatanHariIni += item.total;
            });
            containerRiwayat.innerHTML = html;

            document.getElementById('statOrderan').innerText = riwayatTransaksi.length;
            document.getElementById('statPendapatan').innerText = "Rp. " + totalPendapatanHariIni.toLocaleString('id-ID');
            document.getElementById('gridMingguIni').innerText = `Rp. ${totalPendapatanHariIni.toLocaleString('id-ID')} (${riwayatTransaksi.length}x)`;
            document.getElementById('totalPotonganMingguIni').innerHTML = `Rp. 0 <span style="font-size: 14px; font-weight: normal; color: #555;">(${riwayatTransaksi.length}x)</span>`;
            document.getElementById('targetMingguIni').innerText = `${riwayatTransaksi.length}/35 Order`;
        }
    }

    // Jalankan saat pertama kali muat
    window.onload = function() {
        hitungOtomatis();
        muatDataAkun();
    };
            </script>
