<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DELIVERY</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Control Geocoder CSS (Untuk Pencarian Otomatis) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; z-index: 50; }
        #map { height: 250px; width: 100%; margin-top: 8px; border-radius: 8px; }
        /* Kustomisasi kotak pencarian bawaan geocoder agar menyatu dengan desain */
        .leaflet-control-geocoder {
            border-radius: 0.5rem !important;
            border: 1px solid #d1d5db !important;
            box-shadow: none !important;
            width: 100% !important;
            background: white !important;
        }
        .leaflet-control-geocoder-form input {
            height: 40px;
            padding: 0 12px;
            width: 100%;
            border-radius: 0.5rem;
            outline: none;
            font-size: 14px;
        }
        .leaflet-control-geocoder-alternatives {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
            margin-top: 4px;
        }
        .leaflet-control-geocoder-icon {
            display: none !important; /* Sembunyikan ikon kaca pembesar bawaan */
        }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <!-- CONTAINER UTAMA -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-16">

        <!-- ================= PAGE 1: MENU ================= -->
        <div id="page-menu" style="display: block;" class="p-4">
            <!-- Brand -->
            <div class="bg-green-600 text-white text-center py-3 rounded-lg font-bold text-xl tracking-wider shadow">
                BLUE DELIVERY
            </div>

            <!-- Form Order -->
            <div class="mt-4 space-y-3">
                <!-- Kolom 1: Produk/Jasa -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Produk/Jasa</label>
                    <select id="m-jasa" class="w-full mt-1 p-2 border rounded-lg bg-white">
                        <option value="">Pilih...</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Ojek">Ojek</option>
                        <option value="Antar barang">Antar barang</option>
                    </select>
                </div>

                <!-- Kolom 2: Nama Produk & Jumlah -->
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700">Nama Produk</label>
                        <input type="text" id="m-namaproduk" placeholder="Nama produk..." class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div class="w-24">
                        <label class="block text-sm font-medium text-gray-700">Jumlah</label>
                        <select id="m-jmlproduk" class="w-full mt-1 p-2 border rounded-lg bg-white">
                            <option value="1">1</option>
                            <script>
                                for(let i=2; i<=30; i++) document.write(`<option value="${i}">${i}</option>`);
                            </script>
                        </select>
                    </div>
                </div>

                <!-- Lokasi Pembelian (Otomatis Autocomplete) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Pembelian</label>
                    <div id="search-pembelian-container"></div>
                </div>

                <!-- Lokasi Tujuan (Otomatis Autocomplete) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Tujuan</label>
                    <div id="search-tujuan-container"></div>
                </div>

                <!-- Peta Interaktif -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Peta Lokasi</label>
                    <div id="map"></div>
                </div>

                <!-- Tambahkan Produk Tambahan -->
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700">Tambah Produk</label>
                        <input type="text" id="m-tambahproduk" placeholder="Produk tambahan..." class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div class="w-24">
                        <label class="block text-sm font-medium text-gray-700">Jumlah</label>
                        <select id="m-jmltambah" class="w-full mt-1 p-2 border rounded-lg bg-white">
                            <option value="0">0</option>
                            <script>
                                for(let i=1; i<=30; i++) document.write(`<option value="${i}">${i}</option>`);
                            </script>
                        </select>
                    </div>
                </div>

                <!-- Kotak Centang (Hujan & Ojek) -->
                <div class="flex gap-4 pt-2">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="chk-hujan" class="w-4 h-4 text-green-600 rounded">
                        <span class="text-sm font-medium">Hujan</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="chk-ojek" class="w-4 h-4 text-green-600 rounded">
                        <span class="text-sm font-medium">Ojek</span>
                    </label>
                </div>

                <!-- Tombol Kirim & Bagikan -->
                <button onclick="kirimDanSimpanData()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition">
                    Kirim dan Bagikan
                </button>
            </div>
        </div>

        <!-- ================= PAGE 2: RIWAYAT ================= -->
        <div id="page-riwayat" style="display: none;" class="p-4">
            <h2 class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">Riwayat Order</h2>
            <div id="riwayat-list" class="space-y-3">
                <p class="text-sm text-gray-400 text-center py-6">Belum ada riwayat tersimpan.</p>
            </div>
        </div>

        <!-- ================= PAGE 3: AKUN ================= -->
        <div id="page-akun" style="display: none;" class="p-4 space-y-4">
            <div class="flex flex-col items-center bg-green-50 p-4 rounded-xl border border-green-200">
                <div class="w-20 h-20 bg-green-600 text-white rounded-full flex items-center justify-center text-3xl font-bold shadow">👤</div>
                <h3 class="mt-2 text-lg font-bold text-gray-800">Kurir Blue Delivery</h3>
                <span class="text-xs text-green-700 bg-green-200 px-2 py-0.5 rounded-full font-semibold">Aktif</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white p-3 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500">Orderan</p>
                    <p id="stat-orderan" class="text-lg font-bold text-gray-800">0</p>
                </div>
                <div class="bg-white p-3 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500">Pendapatan</p>
                    <p id="stat-pendapatan" class="text-sm font-bold text-green-600">Rp 0</p>
                </div>
                <div class="bg-white p-3 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500">Potongan (12%)</p>
                    <p id="stat-potongan" class="text-sm font-bold text-red-500">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- ================= NAVIGATION BAR BAWAH ================= -->
        <div class="bottom-nav flex justify-around py-3 bg-white">
            <button onclick="switchTab('menu')" id="nav-menu" class="flex flex-col items-center text-green-600 font-semibold text-xs">
                <span class="text-lg">🏠</span> Menu
            </button>
            <button onclick="switchTab('riwayat')" id="nav-riwayat" class="flex flex-col items-center text-gray-400 font-semibold text-xs">
                <span class="text-lg">📜</span> Riwayat
            </button>
            <button onclick="switchTab('akun')" id="nav-akun" class="flex flex-col items-center text-gray-400 font-semibold text-xs">
                <span class="text-lg">👤</span> Akun
            </button>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Control Geocoder JS -->
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script>
        function switchTab(tab) {
            document.getElementById('page-menu').style.display = tab === 'menu' ? 'block' : 'none';
            document.getElementById('page-riwayat').style.display = tab === 'riwayat' ? 'block' : 'none';
            document.getElementById('page-akun').style.display = tab === 'akun' ? 'block' : 'none';

            ['menu', 'riwayat', 'akun'].forEach(t => {
                let btn = document.getElementById('nav-' + t);
                if(t === tab) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-green-600');
                } else {
                    btn.classList.remove('text-green-600');
                    btn.classList.add('text-gray-400');
                }
            });
            if(tab === 'akun' || tab === 'riwayat') updateAkunView();
        }

        let dbRiwayat = JSON.parse(localStorage.getItem('bd_riwayat')) || [];
        
        // Inisialisasi Peta
        let map = L.map('map').setView([-6.200000, 106.816666], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let markerPembelian = null;
        let markerTujuan = null;
        let teksPembelian = "";
        let teksTujuan = "";
        let coordsPembelian = null;
        let coordsTujuan = null;

        // Geocoder untuk Lokasi Pembelian
        let geocoderPembelian = L.Control.geocoder({
            defaultMarkGeocode: false,
            placeholder: "Ketik lokasi pembelian..."
        }).on('markgeocode', function(e) {
            let bbox = e.geocode.bbox;
            let center = e.geocode.center;
            teksPembelian = e.geocode.name;
            coordsPembelian = center;
            
            if(markerPembelian) map.removeLayer(markerPembelian);
            markerPembelian = L.marker(center).addTo(map).bindPopup("Pembelian: " + teksPembelian).openPopup();
            map.fitBounds(bbox);
        }).addTo(map);

        // Masukkan elemen geocoder pembelian ke dalam div khusus di form
        document.getElementById('search-pembelian-container').appendChild(geocoderPembelian.getContainer());

        // Geocoder untuk Lokasi Tujuan
        let geocoderTujuan = L.Control.geocoder({
            defaultMarkGeocode: false,
            placeholder: "Ketik lokasi tujuan..."
        }).on('markgeocode', function(e) {
            let bbox = e.geocode.bbox;
            let center = e.geocode.center;
            teksTujuan = e.geocode.name;
            coordsTujuan = center;
            
            if(markerTujuan) map.removeLayer(markerTujuan);
            markerTujuan = L.marker(center).addTo(map).bindPopup("Tujuan: " + teksTujuan).openPopup();
            map.fitBounds(bbox);
        }).addTo(map);

        // Masukkan elemen geocoder tujuan ke dalam div khusus di form
        document.getElementById('search-tujuan-container').appendChild(geocoderTujuan.getContainer());

        function hitungJarakKM(lat1, lon1, lat2, lon2) {
            let R = 6371; 
            let dLat = (lat2 - lat1) * Math.PI / 180;
            let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function kirimDanSimpanData() {
            let jasa = document.getElementById('m-jasa').value;
            let namaProduk = document.getElementById('m-namaproduk').value;
            let jmlProduk = parseInt(document.getElementById('m-jmlproduk').value) || 0;
            let tambahProduk = document.getElementById('m-tambahproduk').value;
            let jmlTambah = parseInt(document.getElementById('m-jmltambah').value) || 0;
            let isHujan = document.getElementById('chk-hujan').checked;
            let isOjek = document.getElementById('chk-ojek').checked;

            if(!jasa || !teksPembelian || !teksTujuan) {
                alert("Mohon lengkapi jenis jasa serta pilih Lokasi Pembelian & Lokasi Tujuan dari daftar saran yang muncul!");
                return;
            }

            let jarakKM = hitungJarakKM(coordsPembelian.lat, coordsPembelian.lng, coordsTujuan.lat, coordsTujuan.lng);
            let pendapatan = jarakKM <= 2 ? 7000 : 7000 + (Math.ceil(jarakKM - 2) * 1000);
            let potongan = pendapatan * 0.12;

            let dataBaru = {
                id: Date.now(),
                tanggal: new Date().toISOString(),
                jasa, namaProduk, jmlProduk, tambahProduk, jmlTambah,
                pembelian: teksPembelian,
                tujuan: teksTujuan,
                jarak: jarakKM.toFixed(2) + " km",
                pendapatan, potongan,
                totalOrderan: jmlProduk + jmlTambah
            };

            dbRiwayat.unshift(dataBaru);
            localStorage.setItem('bd_riwayat', JSON.stringify(dbRiwayat));

            let waText = `*BLUE DELIVERY ORDER*%0A--------------------------------%0A` +
                         `Jasa: ${jasa}%0AProduk: ${namaProduk} (${jmlProduk}x)%0A` +
                         `Lokasi Pembelian: ${teksPembelian}%0A` +
                         `Lokasi Tujuan: ${teksTujuan}%0A` +
                         `Estimasi Jarak: ${jarakKM.toFixed(2)} km%0A` +
                         `Pendapatan: Rp ${pendapatan.toLocaleString('id-ID')}`;

            window.open(`https://wa.me/?text=${waText}`, '_blank');
            alert("Data berhasil disimpan!");
        }

        function updateAkunView() {
            let totalOrderan = 0, totalPendapatan = 0, totalPotongan = 0, htmlRiwayat = "";
            dbRiwayat.forEach(item => {
                totalOrderan += item.totalOrderan;
                totalPendapatan += item.pendapatan;
                totalPotongan += item.potongan;
                htmlRiwayat += `<div class="bg-white p-3 rounded-lg border shadow-sm text-xs space-y-1">
                    <div class="flex justify-between font-bold text-gray-700">
                        <span>${item.jasa} - ${item.namaProduk || 'Tanpa Nama'}</span>
                        <span class="text-green-600">Rp ${item.pendapatan.toLocaleString('id-ID')}</span>
                    </div>
                    <p class="text-gray-500">Dari: ${item.pembelian}</p>
                    <p class="text-gray-500">Tujuan: ${item.tujuan} (${item.jarak})</p>
                </div>`;
            });
            if(dbRiwayat.length === 0) htmlRiwayat = `<p class="text-sm text-gray-400 text-center py-6">Belum ada riwayat tersimpan.</p>`;
            document.getElementById('riwayat-list').innerHTML = htmlRiwayat;
            document.getElementById('stat-orderan').innerText = totalOrderan;
            document.getElementById('stat-pendapatan').innerText = `Rp ${totalPendapatan.toLocaleString('id-ID')}`;
            document.getElementById('stat-potongan').innerText = `Rp ${totalPotongan.toLocaleString('id-ID')}`;
        }
    </script>
</body>
</html>
