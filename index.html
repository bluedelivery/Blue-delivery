<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Blue Delivery</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f8;
      padding-bottom: 70px;
    }
    .header {
      background-color: #1e88e5;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .container {
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }
    .page {
      display: none;
    }
    .active {
      display: block;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      font-size: 13px;
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .btn {
      background-color: #1e88e5;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-add {
      background-color: #2196F3;
      padding: 8px;
      margin-top: 5px;
    }
    .autocomplete-wrapper {
      position: relative;
    }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 1000;
      max-height: 150px;
      overflow-y: auto;
      border-radius: 0 0 5px 5px;
    }
    .suggestion-item {
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }
    .suggestion-item:hover {
      background-color: #e3f2fd;
    }
    .product-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }
    .navbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }
    .nav-item {
      text-align: center;
      color: #777;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-item.active-nav {
      color: #1e88e5;
      font-weight: bold;
    }
    .avatar {
      width: 60px;
      height: 60px;
      background: #2196f3;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 10px auto;
    }
  </style>
</head>
<body>

  <div class="header">Laporan Blue Delivery</div>

  <div class="container">
    <!-- HOME PAGE -->
    <div id="page-home" class="page active">
      <div class="card">
        <label>Rincian Produk</label>
        <div id="product-list">
          <div class="product-row">
            <input type="text" placeholder="Harga Produk Cth. 5000" class="prod-price">
            <input type="number" placeholder="Jumlah" class="prod-qty">
          </div>
        </div>
        <button type="button" class="btn btn-add" onclick="addProductRow()">+ Tambah Produk</button>

        <!-- Lokasi Pembelian dengan Autocomplete -->
        <label>>> Lokasi Pembelian</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="lokasi-beli" placeholder="Ketik lokasi (contoh: Lamongan)" oninput="searchLocation(this, 'sug-beli')">
          <div id="sug-beli" class="suggestions"></div>
        </div>

        <!-- Lokasi Pengiriman dengan Autocomplete -->
        <label>>> Lokasi Pengiriman / Tujuan</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="lokasi-tujuan" placeholder="Ketik lokasi tujuan" oninput="searchLocation(this, 'sug-tujuan')">
          <div id="sug-tujuan" class="suggestions"></div>
        </div>

        <label>Jarak (Km)</label>
        <input type="number" id="jarak" placeholder="Jarak dalam Km (cth: 3.5)" oninput="hitungTarif()">

        <label>Tarif Per Km (Rp)</label>
        <input type="number" id="tarif-per-km" value="3000" oninput="hitungTarif()">

        <label>Total Ongkir (Rp)</label>
        <input type="number" id="total-ongkir" readonly>

        <button class="btn" onclick="simpanOrder()">Simpan Laporan</button>
      </div>
    </div>

    <!-- HISTORY PAGE -->
    <div id="page-history" class="page">
      <div class="card">
        <h3>Riwayat Laporan</h3>
        <div id="history-list" style="margin-top: 10px; font-size: 14px;">Belum ada riwayat.</div>
      </div>
    </div>

    <!-- AKUN PAGE -->
    <div id="page-akun" class="page">
      <div class="card" style="text-align: center;">
        <div class="avatar">M</div>
        <h3>PROFILE PENGGUNA</h3>
        <p><b>MUSTOFA</b></p>
        <p style="font-size: 12px; color: #666;">mustofadriverboy@gmail.com</p>
      </div>
      <div class="card" style="background: #fff8e1; border-left: 4px solid #ffb300;">
        <h4 style="color: #b78103;">SOP BLUE DELIVERY</h4>
        <ol style="margin-left: 20px; margin-top: 5px; font-size: 13px;">
          <li>Wajib beratribut setiap hari</li>
          <li>Setoran wajib hari Senin</li>
          <li>Wajib share nota ke admin dan customer</li>
        </ol>
      </div>
    </div>
  </div>

  <!-- NAVBAR BOTTOM -->
  <div class="navbar">
    <div class="nav-item active-nav" onclick="switchPage('home', this)">🏠<br>Home</div>
    <div class="nav-item" onclick="switchPage('history', this)">🕒<br>History</div>
    <div class="nav-item" onclick="switchPage('akun', this)">👤<br>Akun</div>
  </div>

  <script>
    function switchPage(pageId, el) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
      document.getElementById('page-' + pageId).classList.add('active');
      el.classList.add('active-nav');
    }

    function addProductRow() {
      const div = document.createElement('div');
      div.className = 'product-row';
      div.innerHTML = `<input type="text" placeholder="Harga Produk Cth. 5000" class="prod-price"><input type="number" placeholder="Jumlah" class="prod-qty">`;
      document.getElementById('product-list').appendChild(div);
    }

    function hitungTarif() {
      const jarak = parseFloat(document.getElementById('jarak').value) || 0;
      const tarifPerKm = parseFloat(document.getElementById('tarif-per-km').value) || 0;
      document.getElementById('total-ongkir').value = Math.round(jarak * tarifPerKm);
    }

    // Fungsi Autocomplete Alamat Gratis (OpenStreetMap API)
    let timer;
    function searchLocation(inputEl, suggestionId) {
      clearTimeout(timer);
      const query = inputEl.value;
      const sugBox = document.getElementById(suggestionId);
      
      if (query.length < 3) {
        sugBox.innerHTML = '';
        return;
      }

      timer = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=id&limit=5`)
          .then(res => res.json())
          .then(data => {
            sugBox.innerHTML = '';
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = item.display_name;
              div.onclick = () => {
                inputEl.value = item.display_name;
                sugBox.innerHTML = '';
              };
              sugBox.appendChild(div);
            });
          })
          .catch(err => console.log(err));
      }, 400);
    }

    function simpanOrder() {
      alert("Laporan berhasil disimpan!");
    }
  </script>
</body>
</html>
