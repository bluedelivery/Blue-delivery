<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Delivery - Sistem Kurir</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #0056b3; text-align: center; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #0056b3; color: white; border: none; font-size: 16px; margin-top: 15px; cursor: pointer; }
    button:hover { background-color: #003d80; }
    .result { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #0056b3; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h2>Blue Delivery</h2>
  
  <label for="courierName">Nama Kurir:</label>
  <input type="text" id="courierName" placeholder="Masukkan nama kurir">

  <label for="totalOmset">Total Omset Transaksi (Rp):</label>
  <input type="number" id="totalOmset" placeholder="Contoh: 100000" oninput="calculateSalary()">

  <label for="attendance">Uang Hadir Harian:</label>
  <select id="attendance" onchange="calculateSalary()">
    <option value="3000">Hadir (Rp 3.000)</option>
    <option value="0">Tidak Hadir (Rp 0)</option>
  </select>

  <div class="result">
    <p><strong>Komisi (12%):</strong> Rp <span id="commissionText">0</span></p>
    <p><strong>Uang Hadir:</strong> Rp <span id="attendanceText">3000</span></p>
    <p><strong>Total Gaji Diterima:</strong> Rp <span id="totalSalaryText">3000</span></p>
  </div>

  <button onclick="saveTransaction()">Simpan Transaksi</button>

  <h3>Riwayat Transaksi</h3>
  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>Omset</th>
        <th>Total Gaji</th>
      </tr>
    </thead>
    <tbody id="historyTable">
    </tbody>
  </table>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Konfigurasi Firebase Proyek Blue Delivery
  const firebaseConfig = {
    apiKey: "AIzaSyBJVK2_F5HKfIxbJbjQpGk",
    authDomain: "blue-delivery-82637.firebaseapp.com",
    databaseURL: "https://blue-delivery-82637-default-rtdb.firebaseio.com",
    projectId: "blue-delivery-82637",
    storageBucket: "blue-delivery-82637.firebasestorage.app",
    messagingSenderId: "664784438256",
    appId: "1:664784438256:web:0eb965a447",
    measurementId: "G-SZF80TRJXF"
  };

  // Inisialisasi Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Perhitungan Gaji Automatic
  window.calculateSalary = function() {
    const omset = parseFloat(document.getElementById('totalOmset').value) || 0;
    const attendance = parseFloat(document.getElementById('attendance').value) || 0;
    
    const commission = omset * 0.12;
    const totalSalary = commission + attendance;

    document.getElementById('commissionText').innerText = commission.toLocaleString('id-ID');
    document.getElementById('attendanceText').innerText = attendance.toLocaleString('id-ID');
    document.getElementById('totalSalaryText').innerText = totalSalary.toLocaleString('id-ID');

    return { omset, commission, attendance, totalSalary };
  };

  // Simpan Data ke Firebase Realtime Database
  window.saveTransaction = function() {
    const courierName = document.getElementById('courierName').value;
    if (!courierName) {
      alert("Harap masukkan nama kurir!");
      return;
    }

    const { omset, commission, attendance, totalSalary } = window.calculateSalary();

    push(ref(db, 'transactions'), {
      courierName: courierName,
      omset: omset,
      commission: commission,
      attendance: attendance,
      totalSalary: totalSalary,
      timestamp: new Date().toISOString()
    }).then(() => {
      alert("Transaksi berhasil disimpan!");
      document.getElementById('courierName').value = '';
      document.getElementById('totalOmset').value = '';
      window.calculateSalary();
    }).catch((error) => {
      alert("Gagal menyimpan: " + error.message);
    });
  };

  // Tampilkan Riwayat Realtime
  onValue(ref(db, 'transactions'), (snapshot) => {
    const historyTable = document.getElementById('historyTable');
    historyTable.innerHTML = '';
    
    snapshot.forEach((childSnapshot) => {
      const data = childSnapshot.val();
      const row = `<tr>
        <td>${data.courierName}</td>
        <td>Rp ${data.omset.toLocaleString('id-ID')}</td>
        <td>Rp ${data.totalSalary.toLocaleString('id-ID')}</td>
      </tr>`;
      historyTable.innerHTML = row + historyTable.innerHTML;
    });
  });
</script>

</body>
</html>
